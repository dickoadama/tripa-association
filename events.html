<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPA - Événements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <i data-lucide="users"></i>
                <span>TRIPA</span>
            </div>
            
            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="members.html" class="sidebar__link">
                    <i data-lucide="users"></i>
                    <span>Membres</span>
                </a>
                <a href="finances.html" class="sidebar__link">
                    <i data-lucide="wallet"></i>
                    <span>Finances</span>
                </a>
                <a href="meetings.html" class="sidebar__link">
                    <i data-lucide="calendar"></i>
                    <span>Réunions</span>
                </a>
                <a href="events.html" class="sidebar__link sidebar__link--active">
                    <i data-lucide="calendar-days"></i>
                    <span>Événements</span>
                </a>
                <a href="votes.html" class="sidebar__link">
                    <i data-lucide="vote"></i>
                    <span>Votes</span>
                </a>
                
                <div class="sidebar__section-label">Outils</div>
                
                <a href="messages.html" class="sidebar__link">
                    <i data-lucide="message-square"></i>
                    <span>Messagerie</span>
                </a>
                <a href="documents.html" class="sidebar__link">
                    <i data-lucide="folder"></i>
                    <span>Documents</span>
                </a>
                <a href="projects.html" class="sidebar__link">
                    <i data-lucide="kanban"></i>
                    <span>Projets</span>
                </a>
                
                <div style="flex:1"></div>
                
                <a href="settings.html" class="sidebar__link">
                    <i data-lucide="settings"></i>
                    <span>Paramètres</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="btn btn--ghost mobile-only" id="hamburgerBtn">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2>Événements</h2>
                </div>
                
                <div class="header__right" id="headerActions"></div>
            </header>

            <div class="page-content">
                <div class="page-header animate-fade-in">
                    <div>
                        <h1>Événements</h1>
                        <p class="text-muted">Calendrier et activités de l'assemblée</p>
                    </div>
                    <button class="btn btn--primary" id="openAddEventBtn" data-open-modal="addEventModal">
                        <i data-lucide="plus"></i>
                        <span>Nouvel Événement</span>
                    </button>
                </div>

                <div class="toolbar animate-fade-in stagger-1">
                    <div class="toolbar__left">
                        <p class="text-muted" id="eventsCount">—</p>
                    </div>
                    <div class="toolbar__right">
                        <div class="search-bar">
                            <i data-lucide="search" class="search-bar__icon"></i>
                            <input type="text" id="searchInput" class="search-bar__input" placeholder="Rechercher un événement...">
                        </div>
                        <select class="form-select" id="dateFilter">
                            <option value="tous">Tous les événements</option>
                            <option value="avenir">À venir</option>
                            <option value="passes">Passés</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-3 gap-6 animate-fade-in stagger-2 mt-6" id="eventsGrid"></div>
            </div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div class="modal-overlay" id="addEventModal">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title">Créer un Événement</h3>
                <button class="btn btn--icon btn--ghost" data-close-modal="addEventModal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal__body">
                <form id="eventForm">
                    <div class="form-group">
                        <label class="form-label form-label--required">Titre de l'événement</label>
                        <input type="text" id="evTitle" class="form-input" placeholder="Ex: Gala Annuel" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label form-label--required">Date</label>
                            <input type="date" id="evDate" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Heure</label>
                            <input type="time" id="evTime" class="form-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Lieu</label>
                        <input type="text" id="evLocation" class="form-input" placeholder="Ex: Salle des fêtes">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="evDescription" class="form-textarea" placeholder="Détails de l'événement..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close-modal="addEventModal">Annuler</button>
                <button class="btn btn--primary" type="submit" form="eventForm">Créer l'événement</button>
            </div>
        </div>
    </div>
    
    <div class="sidebar-overlay"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/events.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
