<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPA - Projets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .kanban-board { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 24px; min-height: 500px; }
        .kanban-col { min-width: 320px; flex: 1; background: var(--color-bg-secondary); border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--color-border); }
        .kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 600; }
        .kanban-cards { display: flex; flex-direction: column; gap: 12px; }
        .kanban-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: 0.2s; }
        .kanban-card:hover { border-color: var(--color-accent-primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <i data-lucide="users"></i><span>TRIPA</span>
            </div>
            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link"><i data-lucide="layout-dashboard"></i><span>Tableau de bord</span></a>
                <a href="members.html" class="sidebar__link"><i data-lucide="users"></i><span>Membres</span></a>
                <a href="finances.html" class="sidebar__link"><i data-lucide="wallet"></i><span>Finances</span></a>
                <a href="meetings.html" class="sidebar__link"><i data-lucide="calendar"></i><span>Réunions</span></a>
                <a href="events.html" class="sidebar__link"><i data-lucide="calendar-days"></i><span>Événements</span></a>
                <a href="votes.html" class="sidebar__link"><i data-lucide="vote"></i><span>Votes</span></a>
                <div class="sidebar__section-label">Outils</div>
                <a href="messages.html" class="sidebar__link"><i data-lucide="message-square"></i><span>Messagerie</span></a>
                <a href="documents.html" class="sidebar__link"><i data-lucide="folder"></i><span>Documents</span></a>
                <a href="projects.html" class="sidebar__link sidebar__link--active"><i data-lucide="kanban"></i><span>Projets</span></a>
                <div style="flex:1"></div>
                <a href="settings.html" class="sidebar__link"><i data-lucide="settings"></i><span>Paramètres</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="btn btn--ghost mobile-only" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                    <h2>Projets & Tâches</h2>
                </div>
                <div class="header__right" id="headerActions"></div>
            </header>

            <div class="page-content">
                <div class="page-header animate-fade-in flex justify-between items-center">
                    <div>
                        <h1>Projets & Tâches</h1>
                        <p class="text-muted">Suivi des activités et actions en cours</p>
                    </div>
                    <button class="btn btn--primary" data-open-modal="addTaskModal">
                        <i data-lucide="plus"></i>
                        <span>Nouvelle Tâche</span>
                    </button>
                </div>

                <div class="flex justify-between items-center mb-6 gap-4 flex-wrap animate-fade-in stagger-1">
                    <p class="text-muted" id="projectsCount">—</p>
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text" id="searchInput" class="form-input" placeholder="Rechercher une tâche...">
                    </div>
                </div>

                <div class="kanban-board animate-fade-in stagger-1" id="kanbanBoard"></div>
            </div>
        </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="addTaskModal">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title">Nouvelle Tâche</h3>
                <button class="btn btn--icon btn--ghost" data-close-modal="addTaskModal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal__body">
                <form id="projectForm">
                    <div class="form-group">
                        <label class="form-label form-label--required">Titre</label>
                        <input type="text" id="projTitle" class="form-input" placeholder="Que faut-il faire ?" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="projDescription" class="form-textarea" placeholder="Détails de la tâche..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Statut</label>
                            <select id="projStatus" class="form-select">
                                <option value="a_faire">À faire</option>
                                <option value="en_cours">En cours</option>
                                <option value="termine">Terminé</option>
                                <option value="en_panne">En attente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Progression (%)</label>
                            <input type="number" id="projProgress" class="form-input" min="0" max="100" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date limite</label>
                        <input type="date" id="projDue" class="form-input">
                    </div>
                </form>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" data-close-modal="addTaskModal">Annuler</button>
                <button class="btn btn--primary" type="submit" form="projectForm">Créer la tâche</button>
            </div>
        </div>
    </div>
    
    <div class="sidebar-overlay"></div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/projects.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
