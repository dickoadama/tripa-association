# TRIPA — configuration Fly.io
app = 'tripa-assos'
primary_region = 'cdg'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/tripa.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'tripa_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
