# Blueprint Render — déploie TRIPA comme service web Docker.
# Base de données : Supabase (Postgres gratuit). DATABASE_URL et JWT_SECRET sont des
# secrets à saisir dans le tableau de bord Render (jamais commités).
services:
  - type: web
    name: tripa
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@tripa.com
      - key: SUPER_ADMIN_PASSWORD
        value: tripa-super-2026   # à changer après le premier déploiement
      - key: DATABASE_URL
        sync: false                # secret : chaîne de connexion Postgres Supabase
      - key: JWT_SECRET
        sync: false                # secret : longue chaîne aléatoire
