<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIPA — Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebarHost"></aside>
    <div>
      <header id="topbarHost"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const profile=await requireAuth(['active']); if(!profile) return;
      buildLayout('dashboard','Tableau de bord');
      const content=document.getElementById('content');
      content.innerHTML='<div class="grid grid--4 mb-6" id="statGrid"></div>'+
        '<div class="card"><div class="card__header"><h3>Accès rapide</h3></div><div class="card__body"><div class="grid grid--3" id="quick"></div></div></div>';
      const keys=['adherents','cotisations','evenements','taches'];
      const counts={};
      for(const k of keys){ const {data}=await fetchAll(k,{limit:5000}); counts[k]=(data||[]).length; }
      document.getElementById('statGrid').innerHTML=keys.map(k=>{ const s=ENTITY_SCHEMA[k];
        return `<div class="card card__body"><div class="row" style="gap:12px;"><i data-lucide="${s.icon}" style="color:var(--accent)"></i>
          <div><div style="font-size:26px;font-weight:600;">${counts[k]}</div><div class="muted">${s.label}</div></div></div></div>`; }).join('');
      document.getElementById('quick').innerHTML=Object.keys(ENTITY_SCHEMA).map(k=>{ const s=ENTITY_SCHEMA[k];
        return `<a class="card card__body row" href="entity.html?t=${k}" style="gap:10px;"><i data-lucide="${s.icon}" style="color:var(--accent)"></i>${s.label}</a>`; }).join('');
      lucide.createIcons();
    });
  </script>
</body>
</html>
