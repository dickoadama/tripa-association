<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TRIPA — Tableau de bord</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/prefs.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <meta name="theme-color" content="#4f46e5">
  <script src="js/lucide.js"></script>
  <script src="js/chart.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebarHost"></aside>
    <div>
      <header id="topbarHost"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const PALETTE = { actif:'#16a34a', inactif:'#9ca3af', suspendu:'#dc2626', payee:'#16a34a',
      en_attente:'#d97706', en_retard:'#dc2626', a_faire:'#9ca3af', en_cours:'#0284c7',
      termine:'#16a34a', attente:'#d97706', conference:'#4f46e5', fete:'#a855f7', atelier:'#06b6d4',
      sortie:'#f59e0b', autre:'#6b7280' };

    function tally(rows, key){ const m={}; rows.forEach(r=>{ const v=(r[key]||'—'); m[v]=(m[v]||0)+1; }); return m; }
    function doughnut(canvas, map){
      const labels=Object.keys(map), data=labels.map(l=>map[l]);
      new Chart(canvas,{ type:'doughnut', data:{ labels:labels.map(l=>humanize(l)),
        datasets:[{ data, backgroundColor:labels.map(l=>PALETTE[l]||'#4f46e5'), borderWidth:0 }] },
        options:{ plugins:{ legend:{ position:'bottom' } }, cutout:'62%' } });
    }
    function bars(canvas, map, color='#4f46e5'){
      const labels=Object.keys(map), data=labels.map(l=>map[l]);
      new Chart(canvas,{ type:'bar', data:{ labels:labels.map(l=>humanize(l)),
        datasets:[{ data, backgroundColor:color, borderRadius:6 }] },
        options:{ plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } } });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const profile = await requireAuth(['active']); if (!profile) return;
      if (profile.role === 'super_admin') { location.href = 'admin-management.html'; return; }
      buildLayout('dashboard', 'Tableau de bord');
      const content = document.getElementById('content');
      content.innerHTML = '<div class="grid grid--4 mb-6" id="statGrid"></div>'+
        '<div class="grid grid--2 mb-6"><div class="card"><div class="card__header"><h3>Adhérents par statut</h3></div><div class="card__body"><canvas id="cAdh"></canvas></div></div>'+
        '<div class="card"><div class="card__header"><h3>Cotisations par statut</h3></div><div class="card__body"><canvas id="cCot"></canvas></div></div></div>'+
        '<div class="grid grid--2 mb-6"><div class="card"><div class="card__header"><h3>Tâches par statut</h3></div><div class="card__body"><canvas id="cTach"></canvas></div></div>'+
        '<div class="card"><div class="card__header"><h3>Événements par type</h3></div><div class="card__body"><canvas id="cEven"></canvas></div></div></div>'+
        (profile.role === 'admin' ? '<div class="card mb-6"><div class="card__header"><h3><i data-lucide="mail-plus"></i> Inviter un utilisateur</h3></div><div class="card__body">'+
        '<div class="row wrap" style="gap:8px;"><input class="input" id="invEmail" type="email" placeholder="Email de la personne invitée" style="max-width:320px;">'+
        '<input class="input" id="invNom" placeholder="Nom (facultatif)" style="max-width:180px;">'+
        '<button class="btn btn--primary btn--sm" id="invGo"><i data-lucide="link"></i> Générer le lien</button></div>'+
        '<div id="invOut" class="mt-2"></div><div id="invList" class="mt-4"></div></div></div>' : '')+
        '<div class="card"><div class="card__header"><h3>Accès rapide</h3></div><div class="card__body"><div class="grid grid--3" id="quick"></div></div></div>';

      const EMPTY = { counts:{}, tallies:{adherents:{},cotisations:{},taches:{},evenements:{}}, total_encaisse:0 };
      let S = EMPTY;
      const { data, error } = await fetchStats();
      if (!error && data) S = Object.assign(EMPTY, data);
      const stats = [
        { k:'adherents', label:'Adhérents', val:S.counts.adherents||0 },
        { k:'cotisations', label:'Cotisations', val:S.counts.cotisations||0 },
        { k:'evenements', label:'Événements', val:S.counts.evenements||0 },
        { k:'taches', label:'Tâches', val:S.counts.taches||0 }
      ];
      document.getElementById('statGrid').innerHTML = stats.map(s=>{
        const schema=ENTITY_SCHEMA[s.k];
        return `<div class="card card__body"><div class="row" style="gap:12px;"><i data-lucide="${schema.icon}" style="color:var(--accent)"></i>
          <div><div class="stat__num" style="font-size:26px;font-weight:600;" data-count="${s.val}">0</div><div class="muted">${s.label}</div></div></div></div>`; }).join('') +
        `<div class="card card__body" style="grid-column:1/-1;"><span class="muted">Total encaissé (cotisations payées)</span>
          <div class="stat__num stat__money" style="font-size:24px;font-weight:600;color:var(--success);" data-count="${S.total_encaisse||0}">0 FCFA</div></div>`;

      if (window.Chart){
        doughnut(document.getElementById('cAdh'), S.tallies.adherents||{});
        doughnut(document.getElementById('cCot'), S.tallies.cotisations||{});
        bars(document.getElementById('cTach'), S.tallies.taches||{}, '#0284c7');
        bars(document.getElementById('cEven'), S.tallies.evenements||{}, '#4f46e5');
      }
      const quickKeys = Object.keys(ENTITY_SCHEMA).filter(k => profile.role !== 'user' || USER_NAV_KEYS.includes(k));
      document.getElementById('quick').innerHTML = quickKeys.map(k=>{ const s=ENTITY_SCHEMA[k];
        return `<a class="card card__body row" href="entity.html?t=${k}" style="gap:10px;"><i data-lucide="${s.icon}" style="color:var(--accent)"></i>${s.label}</a>`; }).join('');

      if (profile.role === 'admin') wireInvites();
      lucide.createIcons();
    });

    function wireInvites(){
      const renderList = async () => {
        const { data } = await listInvitations();
        const box = document.getElementById('invList'); if (!box) return;
        const mine = (data || []).filter(i => i.role === 'user');
        box.innerHTML = mine.length ? '<div class="table-wrap"><table class="table"><thead><tr><th>Email</th><th>Lien</th><th>Créée</th><th style="text-align:right;">Actions</th></tr></thead><tbody>' +
          mine.map(i => `<tr><td><b>${esc(i.email)}</b></td><td><code style="font-size:11px;word-break:break-all;">${esc(invitationLink(i.token))}</code></td><td>${formatDate(i.created_at)}</td>
            <td style="text-align:right;white-space:nowrap;"><button class="btn btn--ghost btn--sm" data-copy="${esc(i.token)}"><i data-lucide="copy"></i></button>
            <a class="btn btn--ghost btn--sm" href="mailto:${encodeURIComponent(i.email)}?subject=${encodeURIComponent('Invitation TRIPA')}&body=${encodeURIComponent('Rejoignez TRIPA via ce lien :\n' + invitationLink(i.token))}"><i data-lucide="mail"></i></a>
            <button class="btn btn--ghost btn--sm" style="color:var(--danger)" data-del="${esc(i.token)}"><i data-lucide="trash-2"></i></button></td></tr>`).join('') +
          '</tbody></table></div>' : '<span class="muted" style="font-size:13px;">Aucune invitation en attente.</span>';
        box.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
          const link = invitationLink(b.dataset.copy); let ok = false;
          try { await navigator.clipboard.writeText(link); ok = true; } catch (_) {}
          showToast(ok ? 'Lien copié.' : 'Copie impossible.', ok ? 'success' : 'warning');
        }));
        box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('Supprimer cette invitation ?')) return;
          const { error } = await deleteInvitation(b.dataset.del);
          if (error) { showToast('Erreur : ' + error.message, 'danger'); return; }
          showToast('Invitation supprimée.', 'success'); renderList();
        }));
        if (window.lucide) lucide.createIcons();
      };
      const go = document.getElementById('invGo');
      if (go) go.addEventListener('click', async () => {
        const email = (document.getElementById('invEmail').value || '').trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Email invalide.', 'danger'); return; }
        go.disabled = true;
        const { data, error } = await createInvitation({ email, role: 'user', nom: (document.getElementById('invNom').value || '').trim() });
        go.disabled = false;
        if (error) { showToast('Erreur : ' + error.message, 'danger'); return; }
        const link = invitationLink(data.token);
        document.getElementById('invOut').innerHTML = `<div class="badge badge--success">Invitation créée</div><br>
          <code style="font-size:12px;word-break:break-all;">${esc(link)}</code>
          <button class="btn btn--ghost btn--sm" id="copyNewInvite"><i data-lucide="copy"></i> Copier</button>`;
        document.getElementById('copyNewInvite').addEventListener('click', async () => {
          let ok = false; try { await navigator.clipboard.writeText(link); ok = true; } catch (_) {}
          showToast(ok ? 'Lien copié.' : 'Copie impossible.', ok ? 'success' : 'warning');
        });
        document.getElementById('invEmail').value = ''; document.getElementById('invNom').value = '';
        renderList();
        if (window.lucide) lucide.createIcons();
      });
      renderList();
    }
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
