<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPA - Inscription</title>
    <meta name="description" content="Créez votre compte TRIPA pour rejoindre ou créer votre assemblée.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/app.css">
    <style>
        .auth-layout {
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-main, #121212);
        }
        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            overflow-y: auto;
            max-height: 100vh;
        }
        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-card, #1e1e1e);
            padding: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        @media (max-width: 768px) {
            .auth-right {
                display: none;
            }
            .auth-left {
                max-height: none;
                overflow-y: visible;
            }
        }
        .auth-form-container {
            width: 100%;
            max-width: 560px;
            margin: 0.25rem 0;
        }
        .page-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.1rem;
            color: var(--text-main, #ffffff);
        }
        .auth-subtitle {
            color: var(--text-muted, #9ca3af);
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }
        .form-input {
            width: 100%;
            padding: 0.35rem 0.6rem;
            font-size: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border-color, #333);
            background: var(--bg-card, #1e1e1e);
            color: white;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent, #f59e0b);
        }
        .form-label {
            display: block;
            margin-bottom: 0.15rem;
            color: var(--text-main, #fff);
            font-size: 0.72rem;
        }
        .compact-form {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        @media (max-width: 520px) {
            .form-grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .type-card {
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            padding: 0.35rem 0.25rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: var(--bg-card, #1e1e1e);
            user-select: none;
        }
        .type-card:hover {
            border-color: rgba(245, 158, 11, 0.5);
        }
        .type-card.selected {
            border-color: var(--accent, #f59e0b);
            background: rgba(245, 158, 11, 0.1);
        }
        .strength-meter {
            height: 3px;
            background: #333;
            border-radius: 2px;
            margin-top: 0.25rem;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .pwd-wrap {
            position: relative;
        }
        .pwd-wrap .form-input {
            padding-right: 2rem;
        }
        .pwd-toggle {
            position: absolute;
            right: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted, #9ca3af);
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .pwd-toggle:hover {
            color: var(--accent, #f59e0b);
        }
        .consent-row {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: var(--text-muted, #9ca3af);
        }
        .consent-row input[type="checkbox"] {
            margin-top: 0.15rem;
            accent-color: var(--accent, #f59e0b);
            cursor: pointer;
        }
        .consent-row a {
            color: var(--accent, #f59e0b);
            text-decoration: none;
        }
        .submit-btn {
            width: 100%;
            padding: 0.5rem;
            background: var(--accent, #f59e0b);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: filter 0.2s ease;
        }
        .submit-btn:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-left">
            <div class="auth-form-container animate-fade-in">
                <div class="brand flex items-center gap-2 stagger-1" style="margin-bottom: 0.5rem;">
                    <div class="logo-icon text-accent">
                        <i data-lucide="triangle" fill="currentColor" style="color: var(--accent, #f59e0b); width: 24px; height: 24px;"></i>
                    </div>
                    <span class="logo-text text-accent" style="font-weight: 700; font-size: 1.1rem; color: var(--accent, #f59e0b);">TRIPA</span>
                </div>
                
                <h1 class="page-title stagger-2">Créer un compte</h1>
                <p class="auth-subtitle stagger-2">Rejoignez votre assemblée sur TRIPA</p>
                
                <form id="register-form" class="stagger-3 compact-form">
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="firstname" class="form-label">Prénom</label>
                            <input type="text" id="firstname" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname" class="form-label">Nom</label>
                            <input type="text" id="lastname" class="form-input" required>
                        </div>
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-input" required placeholder="votre@email.com">
                        </div>
                        <div class="form-group">
                            <label for="phone" class="form-label">Téléphone</label>
                            <input type="tel" id="phone" class="form-input" required placeholder="+33 6 00 00 00 00">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Type d'association</label>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
                            <div class="type-card selected" onclick="selectType(this, 'religieuse')">
                                <div style="font-size: 1rem; margin-bottom: 0.1rem;">🕊️</div>
                                <div style="font-size: 0.72rem; color: var(--text-main, #fff);">Religieuse</div>
                            </div>
                            <div class="type-card" onclick="selectType(this, 'amicale')">
                                <div style="font-size: 1rem; margin-bottom: 0.1rem;">🤝</div>
                                <div style="font-size: 0.72rem; color: var(--text-main, #fff);">Amicale</div>
                            </div>
                            <div class="type-card" onclick="selectType(this, 'familiale')">
                                <div style="font-size: 1rem; margin-bottom: 0.1rem;">👨‍👩‍👧‍👦</div>
                                <div style="font-size: 0.72rem; color: var(--text-main, #fff);">Familiale</div>
                            </div>
                        </div>
                        <input type="hidden" id="asso-type" value="religieuse">
                    </div>
                    
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="password" class="form-label">Mot de passe</label>
                            <div class="pwd-wrap">
                                <input type="password" id="password" class="form-input" required oninput="checkStrength(this.value)" placeholder="••••••••">
                                <button type="button" class="pwd-toggle" onclick="togglePwd('password', this)" aria-label="Afficher le mot de passe">
                                    <i data-lucide="eye" style="width:15px;height:15px;"></i>
                                </button>
                            </div>
                            <div class="strength-meter">
                                <div id="strength-fill" class="strength-meter-fill"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password" class="form-label">Confirmer</label>
                            <div class="pwd-wrap">
                                <input type="password" id="confirm-password" class="form-input" required placeholder="••••••••">
                                <button type="button" class="pwd-toggle" onclick="togglePwd('confirm-password', this)" aria-label="Afficher le mot de passe">
                                    <i data-lucide="eye" style="width:15px;height:15px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <label class="consent-row">
                        <input type="checkbox" id="consent" required>
                        <span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a></span>
                    </label>
                    
                    <button type="submit" class="submit-btn" style="margin-top: 0.1rem;">Créer mon compte</button>
                </form>
                
                <div class="auth-footer stagger-4" style="margin-top: 0.6rem; text-align: center; color: var(--text-muted, #9ca3af); font-size: 0.8rem;">
                    <p>Déjà un compte? <a href="index.html" class="text-accent" style="color: var(--accent, #f59e0b); text-decoration: none; font-weight: 500;">Se connecter</a></p>
                </div>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-feature-box animate-fade-in" style="max-width: 450px;">
                <div style="margin-bottom: 1rem; color: var(--accent, #f59e0b);">
                    <i data-lucide="shield-check" style="width: 40px; height: 40px;"></i>
                </div>
                <h2 style="font-size: 1.75rem; margin-bottom: 1rem; line-height: 1.2; font-weight: 700; color: var(--text-main, #fff);">Rejoignez la communauté</h2>
                <ul class="features-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; color: var(--text-muted, #9ca3af); font-size: 1rem;">
                    <li style="display: flex; align-items: center; gap: 1rem;">
                        <i data-lucide="check-circle" style="color: var(--accent, #f59e0b); flex-shrink: 0;"></i>
                        <span>Créez ou rejoignez une assemblée</span>
                    </li>
                    <li style="display: flex; align-items: center; gap: 1rem;">
                        <i data-lucide="check-circle" style="color: var(--accent, #f59e0b); flex-shrink: 0;"></i>
                        <span>Collaborez en toute sécurité</span>
                    </li>
                    <li style="display: flex; align-items: center; gap: 1rem;">
                        <i data-lucide="check-circle" style="color: var(--accent, #f59e0b); flex-shrink: 0;"></i>
                        <span>Outils dédiés pour chaque type d'association</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        function selectType(element, type) {
            document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('asso-type').value = type;
        }

        function togglePwd(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.getAttribute('type') === 'password') {
                input.setAttribute('type', 'text');
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.setAttribute('type', 'password');
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function checkStrength(pwd) {
            const fill = document.getElementById('strength-fill');
            let strength = 0;
            if(pwd.length >= 8) strength += 25;
            if(pwd.match(/[A-Z]/)) strength += 25;
            if(pwd.match(/[0-9]/)) strength += 25;
            if(pwd.match(/[^A-Za-z0-9]/)) strength += 25;
            
            fill.style.width = strength + '%';
            if(strength <= 25) fill.style.backgroundColor = '#ef4444'; // danger
            else if(strength <= 50) fill.style.backgroundColor = '#f59e0b'; // warning
            else if(strength <= 75) fill.style.backgroundColor = '#3b82f6'; // info
            else fill.style.backgroundColor = '#10b981'; // success
        }
    </script>
</body>
</html>
