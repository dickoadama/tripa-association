<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIPA — Inscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-brand">
      <h1>Rejoignez TRIPA</h1>
      <p>Créez le compte de votre association. Votre accès sera validé par le Super Admin.</p>
    </section>
    <section class="auth-panel">
      <div class="card auth-card"><div class="card__body">
        <h2>Créer un compte</h2>
        <p class="auth-sub">Remplissez vos informations.</p>
        <form id="register-form">
          <div class="grid grid--2">
            <div class="field"><label class="label" for="firstname">Prénom</label><input class="input" id="firstname"></div>
            <div class="field"><label class="label" for="lastname">Nom</label><input class="input" id="lastname"></div>
          </div>
          <div class="field"><label class="label" for="email">Email</label><input class="input" type="email" id="email" required></div>
          <div class="field"><label class="label" for="phone">Téléphone</label><input class="input" id="phone"></div>
          <div class="field"><label class="label" for="asso-type">Type d'association</label>
            <select class="select" id="asso-type">
              <option value="amicale">Amicale</option><option value="religieuse">Religieuse</option><option value="familiale">Familiale</option>
            </select></div>
          <div class="field"><label class="label" for="password">Mot de passe</label><input class="input" type="password" id="password" required minlength="6"></div>
          <div class="field"><label class="label" for="confirm-password">Confirmer</label><input class="input" type="password" id="confirm-password" required></div>
          <button class="btn btn--primary btn--block" type="submit">Créer mon compte</button>
        </form>
        <p class="auth-footer">Déjà inscrit ? <a href="index.html">Se connecter</a></p>
      </div></div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
