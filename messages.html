<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPA - Messagerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .chat-layout { display: grid; grid-template-columns: 320px 1fr; gap: var(--space-6); height: calc(100vh - 200px); }
        .chat-list { overflow-y: auto; flex: 1; }
        .chat-item { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--color-border); cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background: var(--color-bg-glass-hover); }
        .chat-item.active { background: var(--color-accent-primary-light); border-left: 3px solid var(--color-accent-primary); }
        .chat-item-content { flex: 1; min-width: 0; }
        .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .chat-item-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item-time { font-size: 11px; color: var(--color-text-muted); }
        .chat-item-msg { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-window { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg-in { background: var(--color-bg-glass); align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 16px; border-top: 1px solid var(--color-border); display: flex; gap: 12px; align-items: center; }
        
        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <i data-lucide="users"></i>
                <span>TRIPA</span>
            </div>
            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link"><i data-lucide="layout-dashboard"></i><span>Tableau de bord</span></a>
                <a href="members.html" class="sidebar__link"><i data-lucide="users"></i><span>Membres</span></a>
                <a href="finances.html" class="sidebar__link"><i data-lucide="wallet"></i><span>Finances</span></a>
                <a href="meetings.html" class="sidebar__link"><i data-lucide="calendar"></i><span>Réunions</span></a>
                <a href="events.html" class="sidebar__link"><i data-lucide="calendar-days"></i><span>Événements</span></a>
                <a href="votes.html" class="sidebar__link"><i data-lucide="vote"></i><span>Votes</span></a>
                <div class="sidebar__section-label">Outils</div>
                <a href="messages.html" class="sidebar__link sidebar__link--active"><i data-lucide="message-square"></i><span>Messagerie</span></a>
                <a href="documents.html" class="sidebar__link"><i data-lucide="folder"></i><span>Documents</span></a>
                <a href="projects.html" class="sidebar__link"><i data-lucide="kanban"></i><span>Projets</span></a>
                <div style="flex:1"></div>
                <a href="settings.html" class="sidebar__link"><i data-lucide="settings"></i><span>Paramètres</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="btn btn--ghost mobile-only" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                    <h2>Messagerie</h2>
                </div>
                <div class="header__right" id="headerActions"></div>
            </header>

            <div class="page-content">
                <div class="flex justify-between items-center mb-4 gap-4 flex-wrap animate-fade-in stagger-1">
                    <p class="text-muted" id="messagesCount">—</p>
                    <div class="flex gap-4 items-center flex-wrap">
                        <select class="form-select" id="readFilter">
                            <option value="">Tous</option>
                            <option value="non lus">Non lus</option>
                        </select>
                        <button class="btn btn--primary" data-open-modal="newMessageModal">
                            <i data-lucide="plus"></i> Nouveau Message
                        </button>
                    </div>
                </div>

                <div class="chat-layout animate-fade-in stagger-2">
                    <!-- Inbox Sidebar -->
                    <div class="card chat-sidebar h-full flex flex-col">
                        <div style="padding: 16px; border-bottom: 1px solid var(--color-border);">
                            <div class="search-bar w-full">
                                <i data-lucide="search" class="search-bar__icon"></i>
                                <input type="text" id="searchInput" class="search-bar__input" placeholder="Rechercher...">
                            </div>
                        </div>
                        <div class="chat-list" id="messagesList"></div>
                    </div>

                    <!-- Detail Window -->
                    <div class="card chat-window h-full" id="messageDetail"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- New Message Modal -->
    <div class="modal-overlay" id="newMessageModal">
        <div class="modal">
            <div class="modal__header flex justify-between items-center">
                <h3>Nouveau Message</h3>
                <button class="btn btn--ghost" data-close-modal="newMessageModal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal__body">
                <form id="newMessageForm" class="flex flex-col gap-4">
                    <div class="form-group">
                        <label class="form-label form-label--required">Expéditeur</label>
                        <input type="text" id="msgSender" class="form-input w-full" placeholder="Ex: Fatima Traoré" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Objet</label>
                        <input type="text" id="msgSubject" class="form-input w-full" placeholder="Ex: Validation de dépense">
                    </div>
                    <div class="form-group">
                        <label class="form-label form-label--required">Message</label>
                        <textarea id="msgBody" class="form-input w-full" rows="4" placeholder="Votre message..." required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal__footer flex justify-end gap-3 mt-4">
                <button class="btn btn--ghost" data-close-modal="newMessageModal">Annuler</button>
                <button class="btn btn--primary" type="submit" form="newMessageForm">Envoyer</button>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay"></div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/messages.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
