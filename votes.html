<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPA - Votes en Assemblée</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/app.css">
    
    <style>
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--surface-light);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--accent);
            border-radius: 4px;
        }
        .progress-bar.success { background-color: var(--success); }
        .progress-bar.danger { background-color: var(--danger); }
        .progress-bar.muted { background-color: var(--text-muted); }
        
        .vote-stat {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
        .vote-result-item {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo flex items-center gap-2">
            <div class="avatar avatar--accent">
                <i data-lucide="users"></i>
            </div>
            <h2>TRIPA</h2>
        </div>

        <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link ">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="members.html" class="sidebar__link ">
                    <i data-lucide="users"></i>
                    <span>Membres</span>
                </a>
                <a href="finances.html" class="sidebar__link ">
                    <i data-lucide="wallet"></i>
                    <span>Finances</span>
                </a>
                <a href="meetings.html" class="sidebar__link ">
                    <i data-lucide="calendar"></i>
                    <span>Réunions</span>
                </a>
                <a href="events.html" class="sidebar__link ">
                    <i data-lucide="calendar-days"></i>
                    <span>Événements</span>
                </a>
                <a href="votes.html" class="sidebar__link sidebar__link--active">
                    <i data-lucide="vote"></i>
                    <span>Votes</span>
                </a>
                
                <div class="sidebar__section-label">Outils</div>
                
                <a href="messages.html" class="sidebar__link ">
                    <i data-lucide="message-square"></i>
                    <span>Messagerie</span>
                </a>
                <a href="documents.html" class="sidebar__link ">
                    <i data-lucide="folder"></i>
                    <span>Documents</span>
                </a>
                <a href="projects.html" class="sidebar__link ">
                    <i data-lucide="kanban"></i>
                    <span>Projets</span>
                </a>
                
                <div style="flex:1"></div>
                
                <a href="settings.html" class="sidebar__link ">
                    <i data-lucide="settings"></i>
                    <span>Paramètres</span>
                </a>
            </nav>
    </aside>

    <div class="main-content">
        <!-- Header -->
        <header class="header flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button class="btn btn--ghost sidebar-toggle md-hidden" id="sidebarToggle">
                    <i data-lucide="menu"></i>
                </button>
                <h2 class="header__title">Votes</h2>
            </div>
            <div class="header__right" id="headerActions"></div>
        </header>

        <!-- Page Content -->
        <main class="page-content">
            <div class="page-header animate-fade-in stagger-1 flex justify-between items-center">
                <div class="page-header__info">
                    <h1 class="page-title">Votes en Assemblée</h1>
                    <p class="page-subtitle text-muted">Créez et suivez les votes de votre assemblée</p>
                </div>
                <div class="page-header__actions">
                    <button class="btn btn--primary" data-open-modal="createVoteModal">
                        <i data-lucide="plus"></i>
                        Nouveau Vote
                    </button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex justify-between items-center mb-6 gap-4 flex-wrap animate-fade-in stagger-2">
                <p class="text-muted" id="votesCount">—</p>
                <div class="flex gap-4 items-center flex-wrap">
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text" id="searchInput" class="form-input" placeholder="Rechercher un vote...">
                    </div>
                    <select class="form-select" id="statusFilter">
                        <option value="">Tous</option>
                        <option value="ouvert">En cours</option>
                        <option value="ferme">Terminés</option>
                    </select>
                </div>
            </div>

            <!-- Votes Grid -->
            <div class="votes-grid grid grid-2 animate-fade-in stagger-3" id="votesGrid"></div>
        </main>
    </div>

    <!-- Create Vote Modal -->
    <div class="modal-overlay" id="createVoteModal">
        <div class="modal">
            <div class="modal__header flex justify-between items-center">
                <h3>Créer un nouveau vote</h3>
                <button class="btn btn--ghost" data-close-modal="createVoteModal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal__body">
                <form id="voteForm" class="flex" style="flex-direction: column; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label form-label--required">Sujet du vote</label>
                        <input type="text" id="voteQuestion" class="form-input" placeholder="Ex: Élection du bureau" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="voteDescription" class="form-input" rows="3" placeholder="Détails de la proposition..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date limite</label>
                        <input type="date" id="voteClosesAt" class="form-input">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label flex justify-between items-center">
                            <span>Options de vote</span>
                            <button type="button" id="addOptionBtn" class="btn btn--ghost btn--sm text-accent">
                                <i data-lucide="plus" class="icon-sm"></i> Ajouter
                            </button>
                        </label>
                        <div id="optionsContainer" class="flex" style="flex-direction: column; gap: 0.5rem;"></div>
                    </div>
                </form>
            </div>
            <div class="modal__footer flex justify-end gap-3">
                <button class="btn btn--ghost" data-close-modal="createVoteModal">Annuler</button>
                <button class="btn btn--primary" type="submit" form="voteForm">Créer le vote</button>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/votes.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
