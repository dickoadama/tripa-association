<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIPA — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-brand">
      <h1>TRIPA</h1>
      <p>La plateforme simple pour gérer votre association : adhérents, cotisations, événements, activités et plus encore.</p>
    </section>
    <section class="auth-panel">
      <div class="card auth-card"><div class="card__body">
        <h2>Connexion</h2>
        <p class="auth-sub">Accédez à votre espace d'administration.</p>
        <form id="login-form">
          <div class="field"><label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" required autocomplete="username"></div>
          <div class="field"><label class="label" for="password">Mot de passe</label>
            <input class="input" type="password" id="password" required autocomplete="current-password"></div>
          <button class="btn btn--primary btn--block" type="submit">Se connecter</button>
        </form>
        <p class="auth-footer">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
      </div></div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
