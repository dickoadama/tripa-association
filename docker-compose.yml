# TRIPA — Auto-hébergement avec Docker Compose.
# Démarrage rapide :
#   1) cp .env.example .env        (puis ajustez JWT_SECRET, SUPER_ADMIN_PASSWORD…)
#   2) docker compose up -d --build
# Sans TURSO_DATABASE_URL, la base SQLite locale est écrite dans le volume « tripa-data »
# (persistante entre les redémarrages). Aucun service externe requis.
services:
  tripa:
    build: .
    image: tripa:latest
    container_name: tripa
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-10000}
      JWT_SECRET: ${JWT_SECRET:-mettez-une-longue-chaine-aleatoire-ici}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@tripa.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-tripa-super-2026}
      # Base externalisée (optionnelle) : laissez vide pour la SQLite locale du volume.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      # HTTPS derrière un reverse proxy => COOKIE_SECURE=true ; en HTTP simple => false.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - tripa-data:/app/server/data

  # Sidecar de sauvegarde : s'exécute au démarrage puis toutes les BACKUP_INTERVAL secondes.
  # Lit la base via server/db.js (SQLite du volume, ou Turso si configuré) et écrit dans le volume tripa-backups.
  backup:
    build: .
    image: tripa:latest
    container_name: tripa-backup
    restart: unless-stopped
    depends_on:
      - tripa
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_REDACT_SECRETS: ${BACKUP_REDACT_SECRETS:-false}
    volumes:
      - tripa-data:/app/server/data
      - tripa-backups:/app/backups
    command: ["sh", "-c", "trap 'exit 0' TERM; while true; do node /app/scripts/backup.js; sleep ${BACKUP_INTERVAL:-21600}; done"]

volumes:
  tripa-data:
  tripa-backups:
